name: Build Doro

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --windowed --name Doro --icon=media/icon.ico --add-data "media;media" main.py

    - name: Build Linux/macOS
      if: runner.os != 'Windows'
      run: |
        pyinstaller --onefile --windowed --name Doro --add-data "media:media" main.py

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: Doro-${{ runner.os }}
        path: dist/